name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Post-market close snapshots with automatic retries: 21:30, 22:30, 23:30 UTC Mon-Fri
    - cron: '30 21,22,23 * * 1-5'
    # Morning pre-market verification check: 07:00 UTC Mon-Fri
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch latest market close snapshot
        run: node scripts/fetch-market-data.mjs
        continue-on-error: true

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
